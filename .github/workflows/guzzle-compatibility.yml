name: Guzzle compatibility

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  cookie-session:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        guzzle: ['^7.15.5', '^8.0.3']

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require "guzzlehttp/guzzle:${{ matrix.guzzle }}" --with-all-dependencies --no-interaction
      - run: vendor/bin/phpunit --configuration phpunit.xml.dist --testsuite "PHRETS Unit Test Suite"
